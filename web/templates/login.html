{{define "login.html"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · cq</title>
<style>
:root {
	color-scheme: light dark;
	--bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --line-strong: #cfd4da;
	--fg: #16191d; --fg-2: #5b6470; --fg-3: #858e9a;
	--accent: #1f6feb; --accent-fg: #ffffff;
	--bad: #b3261e; --bad-soft: #fceceb;
	--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #0f1115; --panel: #161a20; --line: #262c35; --line-strong: #333b46;
		--fg: #e8eaed; --fg-2: #a3acb9; --fg-3: #7b8492;
		--accent: #4f9bff; --accent-fg: #0b1220;
		--bad: #ff8a80; --bad-soft: #33191a;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0;
	min-height: 100vh;
	display: grid;
	place-items: center;
	padding: 1.5rem;
	background: var(--bg);
	color: var(--fg);
	font: 400 14px/1.5 var(--sans);
}
form {
	width: 100%;
	max-width: 320px;
	background: var(--panel);
	border: 1px solid var(--line);
	border-radius: 8px;
	padding: 1.5rem;
	box-shadow: 0 1px 3px rgba(16, 20, 26, .06);
}
h1 { font-size: 16px; font-weight: 650; margin: 0 0 .25rem; letter-spacing: -.01em; }
h1 span { color: var(--fg-3); font-weight: 400; }
p.sub { color: var(--fg-2); margin: 0 0 1.25rem; font-size: 13px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--fg-2); margin-bottom: .3rem; }
input {
	appearance: none;
	-webkit-appearance: none;
	width: 100%;
	height: 34px;
	margin: 0 0 .9rem;
	padding: 0 .6rem;
	border: 1px solid var(--line-strong);
	border-radius: 5px;
	background: var(--panel);
	color: var(--fg);
	font: 400 14px/1 var(--sans);
}
button {
	width: 100%;
	height: 34px;
	border: 1px solid var(--accent);
	border-radius: 5px;
	background: var(--accent);
	color: var(--accent-fg);
	font: 500 14px/1 var(--sans);
	cursor: pointer;
}
button:hover { filter: brightness(1.08); }
.error {
	margin: 0 0 1rem;
	padding: .5rem .6rem;
	border-radius: 5px;
	background: var(--bad-soft);
	color: var(--bad);
	font-size: 13px;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<form method="post" action="{{prefix}}/login">
	<h1>cq <span>dashboard</span></h1>
	<p class="sub">Sign in to view queue history.</p>
	{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
	<input type="hidden" name="next" value="{{.Next}}">
	<label for="username">Username</label>
	<input id="username" name="username" autocomplete="username" autofocus required>
	<label for="password">Password</label>
	<input id="password" name="password" type="password" autocomplete="current-password" required>
	<button type="submit">Sign in</button>
</form>
</body>
</html>
{{end}}
